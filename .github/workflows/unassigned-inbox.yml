name: Unassigned inbox companion
on:
  pull_request:
    paths:
      - 'companions/unassigned_inbox/**'
      - 'tests/test_unassigned_companion.py'
      - 'docs/integrations/unassigned-inbox.md'
      - 'docs/adr/0033-read-only-unassigned-companion.md'
      - '.github/workflows/unassigned-inbox.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  companion:
    name: Synthetic companion tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_unassigned_companion.py' -v
      - run: python -m compileall -q companions/unassigned_inbox
  synthetic-core:
    name: Existing synthetic core regression
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python tools/quality_gate.py
      - run: python tools/run_tests.py
