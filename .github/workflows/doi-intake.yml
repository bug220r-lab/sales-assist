name: DOI intake integration
on:
  pull_request:
    paths:
      - 'companions/**'
      - 'DOI_INTAKE.cmd'
      - '.github/workflows/doi-intake.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  companion:
    name: Companion / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Fictional fixtures only; no Google credentials
        run: python -m unittest discover -s companions/doi_intake/tests -v
      - run: python -m compileall -q companions
      - name: Windows launcher offline smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:SSA_DOI_PYTHON = (Get-Command python).Source
          & .\DOI_INTAKE.cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  synthetic-core:
    name: Existing synthetic core regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python tools/quality_gate.py
      - run: python tools/run_tests.py
