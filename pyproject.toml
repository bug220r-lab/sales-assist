[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-sales-assist"
version = "0.1.1"
description = "Synthetic-only Sales Assist rule packs, SQLite persistence, and local CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["tzdata==2026.3; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
ssa-foundation-audit = "synthetic_sales_assist.foundation_audit:main"
synthetic-sales-assist = "synthetic_sales_assist.cli.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["synthetic_sales_assist"]

[tool.coverage.run]
branch = true
source = ["synthetic_sales_assist"]
